[project]
name = "stayflow-ai-backend"
version = "0.1.0"
description = "AI-powered hospitality revenue platform backend"
readme = "../README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.26",
    "fastapi",
    "httpx",
    "passlib[argon2]",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings",
    "pyjwt",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "fakeredis",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "not slow": slow tests download/load the real sentence-transformer model;
# run them explicitly with `pytest -m slow`.
addopts = "-ra -m 'not slow'"
markers = [
    "slow: downloads/loads the real sentence-transformer model and runs retrieval end-to-end",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
