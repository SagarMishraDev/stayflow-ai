# StayFlow AI — public DEMO deployment (Render blueprint).
#
# One free web service, Docker runtime, single port: landing page,
# guest chat, widget, API and the staff dashboard all served by
# app.demo_main (see Dockerfile.demo + docs/DEMO_DEPLOY.md).
#
# The demo now runs the REAL stack: the Mercury LLM (Inception) and a
# persistent Neon PostgreSQL database. DATABASE_URL and
# INCEPTION_API_KEY are declared with `sync: false` — their values are
# set in the Render dashboard only and are never stored in this repo:
#   - DATABASE_URL      the Neon DIRECT connection string (pooling off)
#   - INCEPTION_API_KEY the Inception Labs (Mercury) API key
# On first boot against the empty Neon database the wrapper runs the
# Alembic migrations to head and seeds the demo hotel (DEMO_SEED=1);
# after that, data persists across restarts and redeploys.
#
# WHY ENVIRONMENT=demo (not production): app/core/config.py refuses to
# boot with ENVIRONMENT=production unless the production secrets are
# set (Telegram/Twilio tokens etc.) — by design. This public demo does
# not run the messaging bots, so it uses the non-production "demo"
# environment. Do NOT reuse this blueprint for a real production
# deployment without switching ENVIRONMENT and providing every
# production secret.
#
# Demo login (DEMO-ONLY, seeded on first boot — a throwaway demo
# account on demo data):
#   email    admin@stayflowgrand.example
#   password is the SEED_ADMIN_PASSWORD value below (demo-only)

services:
  - type: web
    name: stayflow-ai-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEMO_SEED
        value: "1"
      - key: ENVIRONMENT
        value: demo
      - key: LLM_PROVIDER
        value: inception
      - key: AGENT_PROVIDER
        value: inception
      - key: EMBEDDING_PROVIDER
        value: hashed
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INCEPTION_API_KEY
        # Set in the Render dashboard (Inception Labs Mercury key).
        # Never commit the value; without it the app refuses to start
        # (fail-fast provider validation in app/main.py).
        sync: false
      - key: DATABASE_URL
        # Set in the Render dashboard: the Neon DIRECT connection
        # string (connection pooling OFF), e.g.
        # postgresql://<user>:<password>@<host>/<db>?sslmode=require
        # The app normalizes it to the psycopg v3 driver automatically.
        # Data persists in Neon across restarts/redeploys.
        sync: false
      - key: SEED_ADMIN_PASSWORD
        value: Preview@123
      # --- Optional: analytics demo data fill -------------------------
      # Adds ~180 clearly-marked synthetic bookings (batch DEMO-FILL-2026)
      # to the seeded demo hotel so the Analytics graphs show real shapes.
      # Add this variable in the Render dashboard with value "1" — the
      # service restarts and fills on boot (idempotent). Later, set it to
      # "cleanup" and restart to remove exactly that batch, then DELETE
      # the variable when done. Declared sync:false so blueprint syncs
      # never overwrite the value chosen in the dashboard.
      # See docs/DEMO_FILL.md.
      - key: ANALYTICS_DEMO_FILL
        sync: false
      # --- Optional: Telegram guest bot (paste-only activation) -------
      # Public URL of this service; the app uses it at startup to
      # register the Telegram webhook. Not a secret.
      - key: APP_PUBLIC_BASE_URL
        value: https://stayflow-ai-demo.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        # From @BotFather (create the bot, copy its token) — paste in
        # the Render dashboard. Without it the bot stays off and the app
        # boots exactly as today.
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        # Any long random string (e.g. `openssl rand -hex 32`). The app
        # registers it with Telegram as the webhook secret_token and
        # verifies it on every inbound update. Paste in the dashboard.
        sync: false
